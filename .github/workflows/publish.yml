name: Publish to pub.dev

# Publishes ONE package when its release tag is pushed (by release.yml, after a
# green master merge). Tag format: <package>-v<version>, for example
# unified_ads_admob-v1.0.1, matching the tag pattern configured on pub.dev
# (<package>-v{{version}}). Auth is GitHub OIDC: no pub.dev secret is stored.
# A tag whose commit is not on master is refused.

on:
  push:
    tags: ['unified_ads*-v[0-9]*']

permissions:
  contents: read
  id-token: write # pub.dev OIDC

env:
  # Keep in sync with ci.yaml.
  FLUTTER_VERSION: 3.47.8

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Parse and check the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"
          version="${tag##*-v}"
          dir="packages/$package"
          [[ -f "$dir/pubspec.yaml" ]] || { echo "::error::No package $package for tag $tag"; exit 1; }
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' "$dir/pubspec.yaml" | head -1 | tr -d "\"' ")"
          [[ "$pubspec_version" == "$version" ]] ||
            { echo "::error::Tag says $version but $dir/pubspec.yaml says $pubspec_version"; exit 1; }
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master ||
            { echo "::error::$tag is not on master; only master is published"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing $package $version from $dir"
      # The packages are Flutter plugins, so publish with the Flutter SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dry run
        working-directory: ${{ steps.tag.outputs.dir }}
        run: flutter pub publish --dry-run
      # Fetches the short-lived GitHub OIDC token and registers it for pub.dev
      # (pub-tokens.json, shared with the Flutter SDK's dart). Kept right
      # before publishing so the token is fresh.
      - uses: dart-lang/setup-dart@v1
      - name: Publish
        working-directory: ${{ steps.tag.outputs.dir }}
        run: flutter pub publish --force
