name: CI

on:
  # Merges into development and master (master merges also gate release.yml).
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the local toolchain (packages require Flutter >= 3.44).
  FLUTTER_VERSION: 3.47.2
  JAVA_VERSION: 17
  # Linux jobs pin ubuntu-24.04 (not ubuntu-latest, which moves to Ubuntu 26 on
  # 2026-10-19) so the Android/JDK toolchain only changes when we bump it.

jobs:
  dart:
    name: Format, analyze, test, publish dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run melos run format
      - run: dart run melos run analyze
      - run: dart run melos run test
      - name: Analyze + test tool/ (verify_ios_plist)
        run: |
          dart analyze --fatal-infos tool
          flutter test tool/test
      - name: Example Info.plist + privacy manifest have every network's entries
        run: dart run melos run verify:ios-plist
      - name: ads_config.json fixture is up to date
        working-directory: packages/unified_ads
        run: >
          dart run unified_ads:generate_config
          --pubspec test/fixtures/pubspec_fixture.yaml
          --output test/fixtures/ads_config.json
          --set-exit-if-changed
      - name: Publish dry-run (every package)
        run: |
          for p in packages/*/; do
            echo "::group::$p"
            (cd "$p" && flutter pub publish --dry-run)
            echo "::endgroup::"
          done

  android:
    name: Android build + Kotlin tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build example APK (all 7 adapters)
        working-directory: example
        run: flutter build apk --debug
      - name: Kotlin unit tests (every adapter)
        run: bash tool/kotlin_tests.sh

  ios:
    name: iOS build (${{ matrix.mode }})
    # ⚠ Google Mobile Ads 13.4+ needs Xcode 26.2+ (SDK_STATUS.md).
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        mode: [spm, cocoapods-dynamic, cocoapods-static]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash tool/ios_build.sh ${{ matrix.mode }}

  opt-in:
    name: Opt-in linking (${{ matrix.platform }}${{ matrix.meta && format(', Meta via {0}', matrix.meta) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-26
          # Opt-in Meta bidding: the documented app-level lines resolve
          # Audience Network (and, for AdMob, keep legacy GMA out).
          - platform: android
            os: ubuntu-24.04
            meta: admob
          - platform: android
            os: ubuntu-24.04
            meta: applovin
          - platform: android
            os: ubuntu-24.04
            meta: ironsource
          - platform: ios
            os: macos-26
            meta: admob
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: App with admob + unity + inmobi links only those SDKs
        run: bash tool/verify_opt_in.sh ${{ matrix.platform }}
        env:
          OPT_IN_WORKDIR: ${{ runner.temp }}
          NETWORKS: admob,unity,inmobi
          META_BIDDING: ${{ matrix.meta }}

  pana:
    name: pana (pub.dev score)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub global activate pana
      - name: Score every package
        # Set PANA_MAX_LOST (allowed points lost per package) once the first
        # run has recorded the achievable scores; see IMPLEMENTATION.md.
        run: bash tool/pana.sh
