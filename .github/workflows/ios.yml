name: iOS simulator

# Builds every adapter for the iOS simulator and runs the ad smoke test
# (example/integration_test/ad_smoke_test.dart) against public test ad units.
# Free GitHub macOS runners only: no code signing, no Apple Developer account,
# no secrets. Screenshots and logs are uploaded as artifacts, even on failure.
# Results feed SDK_STATUS.md ("Verification status").

on:
  # Merges into development and master (master merges also gate release.yml).
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with ci.yaml.
  FLUTTER_VERSION: 3.47.2

jobs:
  smoke:
    name: iOS sim (${{ matrix.target }})
    # ⚠ Google Mobile Ads 13.4+ needs Xcode 26.2+ (SDK_STATUS.md); macos-26
    # ships it.
    runs-on: macos-26
    # Above DRIVE_HARD_TIMEOUT_S (30 min) + package resolution + two Xcode builds, so
    # a hung drive still uploads its screenshots and logs.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # macOS arm64 hosted runners are capacity-constrained; 8 concurrent jobs
      # get dropped ("not acquired by Runner"). Run a few at a time instead.
      max-parallel: 3
      matrix:
        # all = the root example app (every adapter); the rest are scratch
        # apps that depend on that one adapter only.
        target: [all, admob, unity, applovin, ironsource, facebook, startapp, inmobi]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('packages/*/ios/*/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ matrix.target }}-
            spm-${{ runner.os }}-
      - name: Tool versions
        run: |
          xcodebuild -version
          flutter --version
          xcrun simctl list devices available | grep -i iphone | head -20
      # Swift Package Manager: the plugins ship no podspecs.
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Build + smoke test
        run: bash tool/ios_sim_smoke.sh ${{ matrix.target }}
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/${{ matrix.target }}
          SMOKE_WORKDIR: ${{ runner.temp }}
      - name: Job summary
        if: always()
        run: |
          {
            echo "### iOS simulator: ${{ matrix.target }}"
            echo '```'
            if [[ -s artifacts/${{ matrix.target }}/summary.txt ]]; then
              cat artifacts/${{ matrix.target }}/summary.txt
            else
              echo "no smoke summary (build or launch failed, or the app died); drive.log tail:"
              tail -n 60 artifacts/${{ matrix.target }}/drive.log 2> /dev/null || echo "(no drive.log)"
            fi
            echo '```'
            # A native crash never reaches Dart; show the start of its report.
            for ips in artifacts/${{ matrix.target }}/Runner*.ips; do
              [[ -f "$ips" ]] || continue
              echo "#### Crash report: ${ips##*/}"
              echo '```'
              head -n 40 "$ips"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 30
