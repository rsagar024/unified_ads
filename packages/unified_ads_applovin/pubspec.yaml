name: unified_ads_applovin
description: "AppLovin MAX adapter for unified_ads. Add it to link only the AppLovin SDK into your Android and iOS app."
version: 1.0.0
homepage: https://github.com/rsagar024/unified_ads/tree/master/packages/unified_ads_applovin
repository: https://github.com/rsagar024/unified_ads/tree/master/packages/unified_ads_applovin
issue_tracker: https://github.com/rsagar024/unified_ads/issues
topics:
  - ads
  - applovin
  - monetization

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  unified_ads_platform_interface: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.7
  # Tests only: drives the adapter through the real core. Not a runtime dependency.
  unified_ads: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.arovyx.plugin.unifiedads.applovin
        pluginClass: UnifiedAdsApplovinPlugin
        dartPluginClass: ApplovinAdapter
      ios:
        pluginClass: UnifiedAdsApplovinPlugin
        dartPluginClass: ApplovinAdapter
